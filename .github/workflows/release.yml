name: Release

# npm auth uses Trusted Publishing (OIDC) — no NPM_TOKEN secret. The trusted
# publisher (this repo + this workflow filename) must be registered once on
# npmjs.com before the first OIDC publish succeeds. pnpm performs the OIDC
# publish itself, so no npm CLI setup is needed.
on:
  push:
    tags:
      - "v*.*.*"

# Keep the npm comparison and both release mutations in one serialized queue.
concurrency:
  group: release
  queue: max

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
      id-token: write # request the OIDC token for npm Trusted Publishing
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up mise (Node + pnpm)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.6

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Re-run the CI checks: a tag push bypasses ci.yml entirely.
      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      # Before the tests: test/cli.test.js runs the built CLI from dist/.
      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test

      # Prereleases use `next`. Stable backports use `backport` and must not
      # move npm's `latest` dist-tag or GitHub's Latest release backwards.
      - name: Classify release
        id: classify
        run: |
          version="${GITHUB_REF_NAME#v}"
          latest_version=""
          if [[ "$version" != *-* ]]; then
            name="$(node -p "require('./package.json').name")"
            # A package with no `latest` yet exits non-zero; the empty string is
            # the "no previous release" path classify-release.mjs already takes.
            latest_version="$(npm view "$name" dist-tags.latest 2>/dev/null || true)"
          fi
          node .github/scripts/classify-release.mjs \
            "$version" "$latest_version" >>"$GITHUB_OUTPUT"

      # Idempotent: a re-run after a partial failure (publish succeeded but the
      # Release step failed) skips the already-published version instead of
      # dying on npm's republish block. Only E404 means unpublished — any other
      # npm failure is transient and must not fall through to a publish attempt.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          name="$(node -p "require('./package.json').name")"
          spec="${name}@${GITHUB_REF_NAME#v}"
          if err="$(npm view "$spec" version 2>&1 >/dev/null)"; then
            echo "$spec already published — skipping"
          elif grep -q 'E404' <<<"$err"; then
            pnpm publish --provenance --no-git-checks --tag "${{ steps.classify.outputs.npm_tag }}"
          else
            echo "::error::npm view failed for $spec: $err"
            exit 1
          fi

      # Idempotent + --verify-tag: never recreate a deleted tag off the default
      # branch (which would point the Release at code npm never published).
      # Only "release not found" means absent — any other gh failure is
      # transient and must not fall through to a create attempt.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if err="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" 2>&1 >/dev/null)"; then
            echo "$GITHUB_REF_NAME release already exists — skipping"
          elif grep -qi 'release not found' <<<"$err"; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
              ${{ steps.classify.outputs.github_release_flag }}
          else
            echo "::error::gh release view failed for $GITHUB_REF_NAME: $err"
            exit 1
          fi
