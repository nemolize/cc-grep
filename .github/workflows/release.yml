name: Release

# npm auth uses Trusted Publishing (OIDC) — no NPM_TOKEN secret. The trusted
# publisher (this repo + this workflow filename) must be registered once on
# npmjs.com before the first OIDC publish succeeds. pnpm performs the OIDC
# publish itself (>= 11.1.3), so no npm CLI setup is needed.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub Release
      id-token: write # request the OIDC token for npm Trusted Publishing
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up mise (Node + pnpm)
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.6

      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepublishOnly runs `pnpm run build` before publish, so no separate
      # build step is needed here.
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: pnpm publish --provenance --no-git-checks

      # Idempotent: a re-run after a failed publish won't die trying to recreate
      # an existing Release (npm already blocks republishing the same version).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
