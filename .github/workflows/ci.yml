name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Cancelling an in-progress main run would leave that commit with no CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The coverage table is written into the PR description.
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    # Override only the Node major from the matrix; pnpm still comes from
    # mise.toml. Tests the engines floor (>=22) across supported majors, while
    # mise.toml's pinned Node stays the local-dev default.
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads MISE_NODE_VERSION above into both cache keys, so the matrix legs
      # don't share the toolchain or the pnpm store.
      - name: Set up the toolchain and install dependencies
        uses: nemolize/actions/setup@0a6e86438446cdc086f5dc490688523d8fb8282c # v1.4.0

      - name: Lint
        run: pnpm run lint

      # Before the tests: test/cli.test.js runs the built CLI from dist/.
      - name: Build
        run: pnpm run build

      - name: Run unit tests
        id: test
        run: pnpm run test:coverage

      # One matrix leg reports, or both race to overwrite the same PR-body block.
      # `!cancelled()` stops the implicit `success()` from skipping these on red tests.
      - if: ${{ !cancelled() && matrix.node-version == '24' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        name: Write the coverage report to the job summary
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          comment-on: none

      - if: ${{ !cancelled() && matrix.node-version == '24' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        id: table
        name: Render the coverage summary as a table
        run: |
          {
            echo 'markdown<<COVERAGE'
            if [ -f coverage/coverage-summary.json ]; then
              printf '### Coverage\n\n| | metric | %% | covered |\n| --- | --- | --- | --- |\n'
              jq -r '.total as $t
                | ["statements", "branches", "functions", "lines"][] as $m
                | $t[$m]
                | "| \(if .pct >= 90 then "🟢" elif .pct >= 80 then "🟠" else "🔴" end) | \($m) | \(.pct)% | \(.covered)/\(.total) |"' \
                coverage/coverage-summary.json
              printf '\n🟢 90%% and above · 🟠 80–89%% · 🔴 below 80%%\n'
            fi
            echo COVERAGE
          } >> "$GITHUB_OUTPUT"

      - if: ${{ !cancelled() && matrix.node-version == '24' && github.event_name == 'pull_request' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        name: Write the coverage report into the PR description
        uses: nemolize/actions/upsert@77ba465744c758cc704be356f9fbc48d152baa4c # v1.1.0
        with:
          marker: coverage
          body: ${{ steps.table.outputs.markdown }}
          # A run that failed before writing the summary leaves the last table standing.
          on-empty: skip
