name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  # Cancelling an in-progress main run would leave that commit with no CI verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The coverage table is written into the PR description.
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    # Override only the Node major from the matrix; pnpm still comes from
    # mise.toml. Tests the engines floor (>=22) across supported majors, while
    # mise.toml's pinned Node stays the local-dev default.
    env:
      MISE_NODE_VERSION: ${{ matrix.node-version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # nemolize/actions/setup takes no inputs, so it cannot carry the mise pin
      # or the per-Node cache key this matrix needs; the steps stay inline here.
      - name: Set up mise (Node ${{ matrix.node-version }} + pnpm)
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # Pin the mise CLI itself; without this the action installs whichever
          # release is latest at cold-cache time. Renovate keeps this current.
          version: 2026.7.6
          # Include the Node major in the cache key so matrix jobs don't share
          # a single cached install across different Node versions.
          cache_key_prefix: mise-v1-node${{ matrix.node-version }}

      - name: Resolve the pnpm store path
        id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}
          restore-keys: pnpm-store-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs eslint, prettier and the type-check in parallel; --continue-on-error
      # reports every failing one instead of stopping at the first.
      - name: Lint
        run: pnpm run lint

      # Before the tests: test/cli.test.js runs the built CLI from dist/.
      - name: Build
        run: pnpm run build

      - name: Run unit tests
        id: test
        run: pnpm run test:coverage

      # One matrix leg reports, or both race to overwrite the same PR-body block.
      # `!cancelled()` stops the implicit `success()` from skipping these on red tests.
      - if: ${{ !cancelled() && matrix.node-version == '24' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        name: Write the coverage report to the job summary
        uses: davelosert/vitest-coverage-report-action@8b157684c6a6b259b97d45e72b44242865c0f6a5 # v2.12.2
        with:
          comment-on: none

      - if: ${{ !cancelled() && matrix.node-version == '24' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        id: table
        name: Render the coverage summary as a table
        run: |
          {
            echo 'markdown<<COVERAGE'
            if [ -f coverage/coverage-summary.json ]; then
              printf '### Coverage\n\n| | metric | %% | covered |\n| --- | --- | --- | --- |\n'
              jq -r '.total as $t
                | ["statements", "branches", "functions", "lines"][] as $m
                | $t[$m]
                | "| \(if .pct >= 90 then "🟢" elif .pct >= 80 then "🟠" else "🔴" end) | \($m) | \(.pct)% | \(.covered)/\(.total) |"' \
                coverage/coverage-summary.json
              printf '\n🟢 90%% and above · 🟠 80–89%% · 🔴 below 80%%\n'
            fi
            echo COVERAGE
          } >> "$GITHUB_OUTPUT"

      - if: ${{ !cancelled() && matrix.node-version == '24' && github.event_name == 'pull_request' && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        name: Write the coverage report into the PR description
        uses: nemolize/upsert@173e49a4822af386e19526114249b47aa2888f09 # v1.0.1
        with:
          marker: coverage
          body: ${{ steps.table.outputs.markdown }}
          # A run that failed before writing the summary leaves the last table standing.
          on-empty: skip
